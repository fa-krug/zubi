# Generate the Xcode project with: xcodegen generate
# The generated Zubi.xcodeproj is committed: the release workflow builds it as-is.
name: Zubi
options:
  bundleIdPrefix: de.fa-krug.zubi
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Hummingbird:
    url: https://github.com/hummingbird-project/hummingbird.git
    from: 2.0.0

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    # Stable self-signed identity so macOS keeps the Reminders, Calendar and Automation grants across
    # rebuilds. Create it once — see docs/signing.md.
    CODE_SIGN_IDENTITY: "Zubi Self-Signed"
  configs:
    Release:
      # Release-only: library validation refuses Debug's `.debug.dylib`, whose team never matches.
      ENABLE_HARDENED_RUNTIME: YES
      # Strip the shipped binary (dSYM is still generated first) and drop unused code.
      DEPLOYMENT_POSTPROCESSING: YES
      STRIP_INSTALLED_PRODUCT: YES
      STRIP_SWIFT_SYMBOLS: YES
      DEAD_CODE_STRIPPING: YES

targets:
  Zubi:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: Hummingbird
        product: Hummingbird
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.zubi
        INFOPLIST_FILE: Sources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Zubi.entitlements
        COMBINE_HIDPI_IMAGES: YES
      configs:
        # Debug is its own channel: a distinct bundle id means a locally-run build gets its own
        # prefs, TCC grants and login item, and never updates itself.
        Debug:
          PRODUCT_NAME: Zubi Dev
          PRODUCT_BUNDLE_IDENTIFIER: de.fa-krug.zubi.dev
